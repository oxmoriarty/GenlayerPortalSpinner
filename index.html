<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Genlayer Portal</title>
    <style>
      /* Inline critical CSS for the initial loader */
      #global-loader {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background-color: #f1f5f9;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 24px;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #global-loader p {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 500;
        color: #64748b;
        font-size: 1.1rem;
      }
      
      .genlayer-spinner { display: flex; justify-content: center; align-items: center; }
      .genlayer-spinner.large { width: 64px; height: 64px; }
      
      .genlayer-spinner svg {
        width: 100%; height: 100%; overflow: visible;
        filter: drop-shadow(0 0 2px rgba(0,0,0,0.1));
      }
      
      .gl-path {
        fill: transparent; stroke: #0f172a;
        stroke-width: 3; stroke-linejoin: round; stroke-linecap: round;
        stroke-dasharray: 400; stroke-dashoffset: 400;
        animation: draw-init 2s cubic-bezier(0.645, 0.045, 0.355, 1) infinite;
      }
      
      .gl-center { animation-delay: 0.1s; }
      .gl-right { animation-delay: 0.2s; }
      .gl-left { animation-delay: 0s; }
      
      @keyframes draw-init {
        0% { stroke-dashoffset: 400; fill: transparent; opacity: 0.2; }
        30% { stroke-dashoffset: 0; fill: transparent; opacity: 1; }
        50% { stroke-dashoffset: 0; fill: #0f172a; opacity: 1; filter: drop-shadow(0 0 4px rgba(0,0,0,0.2)); }
        80% { stroke-dashoffset: 0; fill: transparent; opacity: 1; }
        100% { stroke-dashoffset: -400; fill: transparent; opacity: 0.2; }
      }
    </style>
  </head>
  <body>
    <!-- Global Loader blocks everything until JS is ready -->
    <div id="global-loader">
      <div class="genlayer-spinner large">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <path class="gl-path gl-center" d="M 99,95 L 92,109 L 92,111 L 86,122 L 86,124 L 98,130 L 101,130 L 113,124 L 113,122 Z" />
          <path class="gl-path gl-right" d="M 107,28 L 107,77 L 132,128 L 130,132 L 109,142 L 174,167 Z" />
          <path class="gl-path gl-left" d="M 92,28 L 25,167 L 90,142 L 69,132 L 67,128 L 92,77 Z" />
        </svg>
      </div>
      <p>Loading Portal...</p>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
