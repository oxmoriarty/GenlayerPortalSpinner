<!DOCTYPE html>
<html>
<head>
    <title>SVG Tracer</title>
    <style>
        body { margin: 0; display: flex; flex-direction: column; align-items: center; background: #333; color: white; }
        .container { position: relative; margin-top: 20px; }
        img { display: block; max-width: 800px; opacity: 0.5; }
        canvas { position: absolute; top: 0; left: 0; cursor: crosshair; }
        textarea { width: 80%; height: 100px; margin-top: 20px; font-family: monospace; }
        button { margin: 10px; padding: 10px; }
    </style>
</head>
<body>
    <h2>Click on the image to trace paths</h2>
    <div class="container">
        <img id="logo" src="public/media_1786988276138.png" />
        <canvas id="canvas"></canvas>
    </div>
    <div>
        <button id="closePath">Close Path</button>
        <button id="clear">Clear All</button>
    </div>
    <textarea id="output" readonly></textarea>

    <script>
        const img = document.getElementById('logo');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const output = document.getElementById('output');
        
        let paths = [];
        let currentPath = [];

        img.onload = () => {
            canvas.width = img.width;
            canvas.height = img.height;
            draw();
        };

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            currentPath.push({x, y});
            draw();
            updateOutput();
        });

        document.getElementById('closePath').addEventListener('click', () => {
            if (currentPath.length > 0) {
                paths.push(currentPath);
                currentPath = [];
                draw();
                updateOutput();
            }
        });

        document.getElementById('clear').addEventListener('click', () => {
            paths = [];
            currentPath = [];
            draw();
            updateOutput();
        });

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'red';
            ctx.lineWidth = 2;
            
            // Draw completed paths
            paths.forEach(path => {
                ctx.beginPath();
                path.forEach((pt, i) => {
                    if (i === 0) ctx.moveTo(pt.x, pt.y);
                    else ctx.lineTo(pt.x, pt.y);
                });
                ctx.closePath();
                ctx.stroke();
                ctx.fillStyle = 'rgba(255, 0, 0, 0.2)';
                ctx.fill();
            });

            // Draw current path
            if (currentPath.length > 0) {
                ctx.beginPath();
                currentPath.forEach((pt, i) => {
                    if (i === 0) ctx.moveTo(pt.x, pt.y);
                    else ctx.lineTo(pt.x, pt.y);
                });
                ctx.stroke();
                
                currentPath.forEach(pt => {
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, 4, 0, Math.PI*2);
                    ctx.fillStyle = 'yellow';
                    ctx.fill();
                });
            }
        }

        function updateOutput() {
            let svg = `<svg viewBox="0 0 ${canvas.width} ${canvas.height}" xmlns="http://www.w3.org/2000/svg">\n`;
            paths.forEach(path => {
                let d = path.map((pt, i) => `${i===0?'M':'L'}${pt.x},${pt.y}`).join(' ') + ' Z';
                svg += `  <path d="${d}" fill="black"/>\n`;
            });
            svg += `</svg>`;
            output.value = svg;
        }
    </script>
</body>
</html>
